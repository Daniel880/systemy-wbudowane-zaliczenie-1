name: Build and Verify

on:
  push:
  pull_request:

jobs:
  configure:
    name: Konfigurowanie CMake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

  build:
    name: Kompilowanie
    runs-on: ubuntu-latest
    needs: configure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

  run:
    name: Czy program się uruchamia bez błędu?
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Run program
        run: ./build/zaliczenie

  validate_output:
    name: Czy output z programu zgadza się z zadaniem?
    runs-on: ubuntu-latest
    needs: run

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Run program
        id: run_program
        run: |
          set -euo pipefail
          OUTPUT=$(./build/zaliczenie)
          echo "Program output: $OUTPUT"
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate output format
        run: |
          set -euo pipefail
          OUTPUT="${{ steps.run_program.outputs.output }}"
          EXPECTED_BRANCH="$GITHUB_REF_NAME"
          NAME_FROM_BRANCH="${EXPECTED_BRANCH#Zaliczenie-}"

          fail() {
            echo "$1"
            echo "Actual output:"
            printf "%s\n" "$OUTPUT"
            exit 1
          }

          if [[ -z "$OUTPUT" ]]; then
            fail "Output is empty"
          fi

          mapfile -t LINES <<< "$OUTPUT"

          if [[ ${#LINES[@]} -ne 5 ]]; then
            echo "Output must contain exactly 5 lines"
            echo "Expected format:"
            echo "Hello World!"
            echo "Imie i Nazwisko: ${NAME_FROM_BRANCH}"
            echo "Nazwa Brancha: ${EXPECTED_BRANCH}"
            echo "IP: <public_ip>,"
            echo "machine_ID: <machine_id>"
            echo "Actual output:"
            printf "%s\n" "$OUTPUT"
            exit 1
          fi

          if [[ "${LINES[0]}" != "Hello World!" ]]; then
            fail "First line must be 'Hello World!'"
          fi

          if [[ "${LINES[1]}" != "Imie i Nazwisko: ${NAME_FROM_BRANCH}" ]]; then
            fail "Second line must be 'Imie i Nazwisko: ${NAME_FROM_BRANCH}'"
          fi

          if [[ "${LINES[2]}" != "Nazwa Brancha: ${EXPECTED_BRANCH}" ]]; then
            fail "Third line must be 'Nazwa Brancha: ${EXPECTED_BRANCH}'"
          fi

          if [[ "${LINES[3]}" =~ ^IP:\ ([0-9]{1,3}(\.[0-9]{1,3}){3}),?$ ]]; then
            IP_FROM_OUTPUT="${BASH_REMATCH[1]}"
            if [[ -z "$IP_FROM_OUTPUT" ]]; then
              fail "IP is empty"
            fi
          else
            fail "Fourth line must match 'IP: <public_ip>,'"
          fi

          if [[ "${LINES[4]}" =~ ^machine_ID:\ (.+)$ ]]; then
            MACHINE_ID_FROM_OUTPUT="${BASH_REMATCH[1]}"
            if [[ -z "$MACHINE_ID_FROM_OUTPUT" ]]; then
              fail "machine_ID is empty"
            fi
          else
            fail "Fifth line must match 'machine_ID: <machine_id>'"
          fi

  validate_branch:
    name: Czy branch ma odpowiednią nazwę?
    runs-on: ubuntu-latest
    needs: configure

    steps:
      - name: Validate branch name
        run: |
          set -euo pipefail
          EXPECTED_BRANCH="$GITHUB_REF_NAME"

          if [[ ! "$EXPECTED_BRANCH" =~ ^Zaliczenie-[A-Za-z]+$ ]]; then
            echo "Branch name must be 'Zaliczenie-ImieNazwisko' (ASCII, no spaces)"
            exit 1
          fi
